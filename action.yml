# Composite GitHub Action for changelog validation and release automation.
#
# Validate on PRs:
#
#   - uses: Londopy/patchnotes@v2
#     with:
#       file: CHANGELOG.md
#       strict: "true"
#       check-version: pyproject.toml
#
# Full release-day flow on tag push (validate -> version sync -> GitHub Release):
#
#   - uses: Londopy/patchnotes@v2
#     with:
#       strict: "true"
#       check-version: ${{ github.ref_name }}
#       release: "true"
#
name: "patchnotes changelog validator"
description: >-
  Validate Keep a Changelog / YAML changelogs, check version sync, and
  publish GitHub Releases with changelog notes.
author: "Londopy"
branding:
  icon: "file-text"
  color: "green"

inputs:
  file:
    description: "Path to the changelog file to validate."
    required: false
    default: "CHANGELOG.md"
  strict:
    description: "Treat warnings as failures ('true' or 'false')."
    required: false
    default: "false"
  check-version:
    description: >-
      Optional version sync check: a metadata file (pyproject.toml,
      package.json, Cargo.toml), a literal version, or a tag such as
      the workflow's github.ref_name. Fails if it doesn't match the
      latest changelog version. Empty = skip.
    required: false
    default: ""
  release:
    description: >-
      'true' = create a GitHub Release for the current tag using the
      latest changelog section as the release notes. Requires running on
      a tag push and `permissions: contents: write`.
    required: false
    default: "false"
  version:
    description: "patchnotes version spec to install (pip requirement specifier)."
    required: false
    default: "patchnotes>=2.2.0"

outputs:
  latest-version:
    description: "The latest released version found in the changelog."
    value: ${{ steps.query.outputs.latest-version }}

runs:
  using: "composite"
  steps:
    - name: Install patchnotes
      shell: bash
      run: python -m pip install --quiet "${{ inputs.version }}"

    - name: Validate changelog
      shell: bash
      run: |
        ARGS=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS="--strict"
        fi
        patchnotes "${{ inputs.file }}" validate $ARGS

    - name: Check version sync
      if: inputs.check-version != ''
      shell: bash
      run: patchnotes "${{ inputs.file }}" check-version --against "${{ inputs.check-version }}"

    - name: Export latest version
      id: query
      shell: bash
      run: |
        LATEST=$(patchnotes "${{ inputs.file }}" --format json latest \
          | python -c "import json,sys; d=json.load(sys.stdin); print(d['version'] if d else '')")
        echo "latest-version=$LATEST" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        patchnotes "${{ inputs.file }}" latest > release-notes.txt
        gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --notes-file release-notes.txt

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchnotes"
version = "2.2.0"
description = "Parse, query, and validate changelogs (Keep a Changelog markdown, YAML) in Python and CI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["changelog", "keepachangelog", "semver", "release", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

[project.scripts]
patchnotes = "patchnotes._cli:main"

[project.urls]
Homepage = "https://github.com/Londopy/patchnotes"
Repository = "https://github.com/Londopy/patchnotes"
"Bug Tracker" = "https://github.com/Londopy/patchnotes/issues"

[tool.hatch.build.targets.wheel]
packages = ["patchnotes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
